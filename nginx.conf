server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets for a day, but never cache the HTML/JS so
    # edits to the source always land on the next visit.
    location ~* \.(css|js|json|jsx)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}